 for(let i=TERMS.length-1;i>=0;i--){const t=TERMS[i][0];if(c.students.some(s=>grades(c,s.id)[t].g!=null))return t}

/* the lowest percent that still passes, read from the term's grade table (so it follows the class's passing mark) */
const passPct=(c,t)=>{const S=c.scales[c.terms[t].scale]||c.scales.A,r=S.find(([m,v])=>c.hi?v>=c.pass:v<=c.pass);return r?r[0]:75};

const sigLv=(p,pp)=>p==null?0:p<pp?1:p<Math.min(pp+10,98)?2:p<Math.min(pp+20,99)?3:4;

 const comps=[],K={},sub=(k,name,ti,cell)=>{const key=String(name).trim().toLowerCase();let x=k.sk[key];if(!x){x=k.sk[key]={name,sub:1,cells:TS.map(()=>null)};k.subs.push(x)}x.cells[ti]=cell};

/* ---------- 3. the PDF ---------- */
/* width of each character in Helvetica (per 1000 units), for ASCII 32..126 - used to align and shorten text */
const PW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const pdfTw=(s,sz,b)=>{let w=0;for(const ch of String(s)){const k=ch.charCodeAt(0);w+=k>=32&&k<=126?PW[k-32]:556}return w*sz/1000*(b?1.07:1)};
/* turn text into the single-byte encoding PDF expects (keeps n-tilde, accents, dashes) and escape ( ) \ */
const PWA={'—':'\x97','–':'\x96','‘':'\x91','’':'\x92','“':'\x93','”':'\x94','•':'\x95','…':'\x85'};
const pdfWa=s=>String(s).replace(/[\r\n\t]+/g,' ').replace(/[^\x00-\xff]/g,ch=>PWA[ch]||'?').replace(/[\\()]/g,'\\$&');

const pdfFit=(s,w,sz,b)=>{s=String(s??'');if(pdfTw(s,sz,b)<=w)return s;while(s.length&&pdfTw(s+'...',sz,b)>w)s=s.slice(0,-1);return s+'...'};

const wrapT=(t,w,sz)=>{let ln='';const out=[];String(t).split(' ').forEach(x=>{if(ln&&pdfTw(ln+' '+x,sz)>w){out.push(ln);ln=x}else ln=ln?ln+' '+x:x});if(ln)out.push(ln);return out};

/* a tiny PDF writer: add pages, draw text / lines / boxes / pictures, then done() returns the file */
function mkPdf(imgs){

  add(){ops=[];pages.push(ops)},
  text(x,y,s,sz,o={}){const w=pdfTw(s,sz,o.b);let X=x;if(o.al=='c')X=x-w/2;else if(o.al=='r')X=x-w;
   ops.push(`BT ${rgb(o.c||'#000000')} rg /F${o.b?2:1} ${sz} Tf ${X.toFixed(2)} ${(H-y).toFixed(2)} Td (${pdfWa(s)}) Tj ET`)},

  line(x1,y1,x2,y2,c,w){ops.push(`${rgb(c||'#000000')} RG ${w||.5} w ${x1} ${H-y1} m ${x2} ${H-y2} l S`)},

   return out}};                                 // the PDF as a "binary string" (1 character = 1 byte)
