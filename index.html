<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#0f1f3d;--mut:#64708a;--line:#dfe4ee;--head:#eaeff8;--field:#fff;--pri:#1b4fa8;--gold:#f2b705;--ok:#1e8a5a;--bad:#c93a3a;--hl:#fff6cf}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:.2em 0;letter-spacing:-.01em}h2{font-size:1.1rem}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{background:linear-gradient(135deg,#12377a,#1b4fa8);color:#fff;border-bottom:3px solid var(--gold);display:flex;gap:.6rem;align-items:center;padding:.6rem 1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem}.brand img{width:2.7rem;height:2.7rem;background:#fff;border-radius:50%;padding:2px}
.brand small{display:block;font-size:.65rem;opacity:.85;letter-spacing:.08em;text-transform:uppercase}.brand b{font-size:1.05rem}
header select{width:auto;max-width:13rem;background:#ffffff1f;color:#fff;border-color:#ffffff50}option{color:#000}
.sp{flex:1}#st{font-size:.75rem;background:#ffffff1f;padding:.2rem .65rem;border-radius:999px}#st:empty{display:none}.em{font-size:.8rem;opacity:.85}
button,select,input,textarea{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.45rem .8rem;font-weight:500;cursor:pointer;transition:.15s}
button:hover{border-color:var(--pri)}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}button.dng{color:var(--bad)}
header button{background:#ffffff1f;border-color:#ffffff50;color:#fff}
nav{display:flex;gap:.25rem;padding:.45rem 1rem;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:transparent;color:var(--mut);border-radius:999px}nav button.on{background:var(--pri);color:#fff}
main{padding:1rem;max-width:1300px;margin:auto}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.5rem 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1rem;box-shadow:0 1px 3px #0f1f3d0f}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem}
label{display:block;font-size:.78rem;color:var(--mut)}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem;background:var(--field)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:.2rem .35rem;text-align:center;white-space:nowrap}
th{background:var(--head);font-weight:600;font-size:.8rem}
td.nm,th.nm{text-align:left;position:sticky;left:0;background:var(--card);min-width:13rem;z-index:1}th.nm{background:var(--head)}
tr:focus-within>td{background:var(--hl)}
.grid input{width:4.4rem;text-align:center}.grid .hn{font-weight:600;background:transparent;border-color:transparent}
.grid input.over,.qr input.over{background:#c93a3a30;border-color:var(--bad)}
td.c{font-weight:600;min-width:3.4rem;background:var(--head)}tr.max th{font-weight:400}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}.chk{margin-left:.5rem;font-size:.85rem}
.chip{display:inline-block;padding:.1rem .65rem;border-radius:999px;font-size:.76rem;font-weight:700;background:#8883}.chip.ok{background:#1e8a5a26}.chip.bad{background:#c93a3a26}
.sub{overflow-x:auto;flex-wrap:nowrap}.sub button{white-space:nowrap;border-radius:999px}.sub button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.qr{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-bottom:1px solid var(--line)}.qr span{flex:1}.qr input{width:6.5rem;font-size:1.3rem;text-align:center;padding:.5rem}
.qb{position:sticky;top:0;background:var(--bg);padding:.4rem 0;z-index:2}.qb select{flex:1;min-width:0}
.fab{position:fixed;right:1rem;bottom:1.5rem;width:3.4rem;height:3.4rem;border-radius:50%;justify-content:center;box-shadow:0 6px 18px #0005;z-index:15}
.empty,.login{text-align:center;padding:3rem 1rem}.login{max-width:30rem;margin:2rem auto}.login img{width:120px}
#toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:10px;display:none;z-index:30}
.ph{display:none}
@media(max-width:700px){main{padding:.6rem .6rem 6rem}header{padding:.5rem .7rem}.form{grid-template-columns:1fr}.em,.lb{display:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:space-around;padding:.25rem .3rem calc(.25rem + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -4px 16px #0003}
nav button{flex:1;flex-direction:column;gap:.1rem;font-size:.68rem;padding:.35rem .2rem;border-radius:10px}nav button .i{width:1.4rem;height:1.4rem}.fab{bottom:5.4rem}}
@media print{header,nav,.bar,#toast,.noprint,.fab{display:none!important}.ph{display:block;text-align:center;margin-bottom:1rem}body{background:#fff}.wrap{border:0}}

<svg width=0 height=0 style="position:absolute" aria-hidden=true><symbol id=i-users viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol><symbol id=i-book viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol><symbol id=i-layers viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></symbol><symbol id=i-flag viewBox="0 0 24 24"><path d="M4 22V3M4 4h13l-2 4 2 4H4"/></symbol><symbol id=i-award viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></symbol><symbol id=i-sliders viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol><symbol id=i-plus viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id=i-minus viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id=i-left viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol><symbol id=i-right viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol><symbol id=i-refresh viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-15-6.7L3 8M3 3v5h5M3 12a9 9 0 0 0 15 6.7L21 16M21 21v-5h-5"/></symbol><symbol id=i-download viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol><symbol id=i-printer viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></symbol><symbol id=i-trash viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol><symbol id=i-grid viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol><symbol id=i-phone viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></symbol><symbol id=i-login viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol><symbol id=i-logout viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol></svg>
<header id="hd"></header><nav id="tabs"></nav><main id="main"></main><div id="toast"></div>
<script>
const I=n=>`<svg class=i><use href="#i-${n}"/></svg>`;
const K='eclass.v2',FN='DBME-eclass-records.json',SC='openid email https://www.googleapis.com/auth/drive.file';
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4),sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const TERMS=[['prelim','Prelim'],['midterm','Midterm'],['final','Final']];
let D=JSON.parse(localStorage[K]||'null')||{classes:[]},cur=localStorage.cur,view='students',comp='att',U=localStorage.user||'',fid=localStorage.fid||'',tok=localStorage.tok,exp=+localStorage.exp||0,auth=0;D.dirty=D.dirty||0;
/* ---------- defaults: taken from the DBME e-class workbook ---------- */
const R=(a,n,f)=>Array.from({length:n},(_,i)=>f(i)+a);
const M1=[0,1,9,17,25,33,41,49,57,66,...R(75,17,i=>i),93,95,97,99],M2=[0,1,4,7,...R(11,16,i=>4*i),...R(75,17,i=>i),93,95,97,99];
const mkS=(m,top)=>m.map((x,i)=>[x,+(top-i/10).toFixed(1)]);
const mkSub=(id,name,w,n,p,m)=>({id,name,w,items:Array.from({length:n},(_,i)=>({n:p+(i+1),m}))});
const newTerm=(scale,own,prev)=>({scale,own,prev,sc:{},comps:[
 {id:'att',name:'Attendance',w:15,subs:[mkSub(uid(),'Attendance',100,6,'A',10)]},
 {id:'cw',name:'Participation & other coursework',w:35,subs:[mkSub(uid(),'Coursework',100,6,'CW',20)]},
 {id:'mp',name:'Major performance',w:25,subs:[mkSub(uid(),'Major performance',100,1,'MP',100)]},
 {id:'me',name:'Major exam',w:25,subs:[mkSub(uid(),'Major exam',100,1,'ST',100)]}]});
const defaults=()=>({scales:{A:mkS(M1,4),B:mkS(M2,5)},pass:3,hi:0,terms:{prelim:newTerm('A',100,0),midterm:newTerm('A',50,50),final:newTerm('B',80,20)}});
const newClass=()=>({id:uid(),u:Date.now(),meta:{school:'TALISAY CITY COLLEGE',sy:'First Semester, A.Y. 2026 - 2027',dept:'Department of Business Management & Entrepreneurship',instructor:'MARL VINCENT L. LABITAD, MPA',course:'ABM 1',title:'ORGANIZATION AND MANAGEMENT',sched:'MONDAY (9:00-10:30 AM) & WED (7:30-9:00 AM)',section:'BSHM 1 - DAISY'},students:[],...defaults()});
const PRE={cw:[['Participation',25,4,'P',10],['Quiz',25,3,'Q',20],['Assignment',25,3,'AS',20],['Reporting',25,1,'R',20]],mp:[['Summative',50,2,'S',50],['Assessment task',50,2,'AT',50]]};
/* ---------- computation ---------- */
const ge=(p,c,t)=>{const S=c.scales[c.terms[t].scale]||c.scales.A;let g=S[0][1];for(const[m,v]of S)if(p>=m)g=v;return g};
const mx=s=>sum(s.items.map(x=>x.m)),subOf=(c,t,id)=>{for(const cp of c.terms[t].comps){const s=cp.subs.find(x=>x.id==id);if(s)return s}};
function sb(c,t,sid,s){const v=(c.terms[t].sc[sid]||{})[s.id]||[],m=mx(s);if(!m||!s.items.some((_,i)=>v[i]!=null))return null;return{p:sum(s.items.map((_,i)=>v[i]))/m*100}}
function cmp(c,t,sid,cp){const subs=cp.subs.map(s=>sb(c,t,sid,s)),u=cp.subs.map((s,i)=>subs[i]?+s.w:0),ws=sum(u),us=subs.filter(Boolean);if(!us.length)return{subs};
 const p=ws?sum(subs.map((x,i)=>x?x.p*u[i]:0))/ws:sum(us.map(x=>x.p))/us.length,g=ge(p,c,t);return{subs,p,g,w:g*cp.w/100}}
const termG=(c,t,sid)=>{const r=c.terms[t].comps.map(cp=>cmp(c,t,sid,cp));return r.every(x=>x.g!=null)?sum(r.map(x=>x.w)):null};
function grades(c,sid){const o={};let pv=null;TERMS.forEach(([t],i)=>{const T=c.terms[t],x=termG(c,t,sid),pr=i?T.prev:0;let g=null;if(x!=null){if(!pr)g=x*T.own/100;else if(pv!=null)g=x*T.own/100+pv*pr/100}o[t]={x,g};pv=g});
 const g=o.final.g;o.rem=g==null?'':(c.hi?g>=c.pass:g<=c.pass)?'PASSED':'FAILED';return o}
/* ---------- state ---------- */
const C=()=>D.classes.find(c=>c.id==cur&&!c.d),live=()=>D.classes.filter(c=>!c.d),save=()=>localStorage[K]=JSON.stringify(D);
const mark=c=>{if(c)c.u=Date.now();D.dirty=1;save();clearTimeout(mark.t);mark.t=setTimeout(()=>sync(),4000)};
const nm=s=>`${s.last||''}, ${s.first||''} ${s.mi||''}`.trim(),f=(v,d=1)=>v==null?'—':v.toFixed(d);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const st=m=>{const e=$('#st');if(e)e.textContent=m;st.m=m},isT=v=>TERMS.some(t=>t[0]==v);
/* ---------- views ---------- */
function render(){
 if(!U&&!localStorage.guest){$('#hd').innerHTML='';$('#tabs').innerHTML='';$('#main').innerHTML=`<div class=login><img src=logo.png alt="Talisay City College"><h1>Class Record</h1><p class=mut>Talisay City College · Department of Business Management &amp; Entrepreneurship</p><p>Sign in with Google. Your records stay on this device and sync to your Google Drive whenever you're online.</p><p><button class=pri data-a=signin>${I('login')}Sign in with Google</button></p><p class=mut>No connection right now?</p><button data-a=guest>Continue offline on this device</button></div>`;return}
 if(!C()&&live().length)cur=live()[0].id;localStorage.cur=cur;const c=C();
 $('#hd').innerHTML=`<div class=brand><img src=logo.png alt=""><div><small>Talisay City College</small><b>Class Record</b></div></div><select data-a=pick>${live().map(x=>`<option value="${x.id}" ${x.id==cur?'selected':''}>${esc(x.meta.course)} · ${esc(x.meta.section)}</option>`).join('')}</select><button data-a=addclass title="New class">${I('plus')}<span class=lb>New class</span></button><span class=sp></span><span id=st>${esc(st.m||'')}</span>${U?`<span class=em>${esc(U)}</span><button data-a=sync title=Sync>${I('refresh')}<span class=lb>Sync</span></button><button data-a=signout title="Sign out">${I('logout')}</button>`:`<button data-a=signin>${I('login')}Sign in</button>`}`;
 if(!c){$('#tabs').innerHTML='';$('#main').innerHTML='<div class=empty><h2>No classes yet</h2><p>Create a class, then add your students.</p><button class=pri data-a=addclass>Create class</button></div>';return}
 $('#tabs').innerHTML=[['students','Students','users'],['prelim','Prelim','book'],['midterm','Midterm','layers'],['final','Final','flag'],['grades','Grades','award'],['set','Rules','sliders']].map(([k,l,i])=>`<button data-v=${k} class="${view==k?'on':''}">${I(i)}<span>${l}</span></button>`).join('');
 $('#main').innerHTML=view=='students'?stuV(c):view=='grades'?gradV(c):view=='set'?setV(c):termV(c,view);
 if(isT(view)&&comp!='sum')recalcAll();if(view=='set')updChk();
}
function stuV(c){const m=c.meta,F=[['school','School'],['sy','Semester / school year'],['dept','Department'],['instructor','Instructor'],['course','Course no.'],['title','Descriptive title'],['sched','Schedule'],['section','Year and section']];
 return `<div class=card><h2>Class details</h2><div class=form>${F.map(([k,l])=>`<label>${l}<input data-m=${k} value="${esc(m[k])}"></label>`).join('')}</div></div>
 <div class=card><h2>Students (${c.students.length})</h2><div class=bar><button class=pri data-a=addstu>${I('plus')}Add student</button><button data-a=sortstu>Sort A–Z</button><button class=dng data-a=delclass>${I('trash')}Delete class</button></div>
 <div class=wrap><table><tr><th>#</th><th>Last name</th><th>First name</th><th>M.I.</th><th>Program</th><th></th></tr>${c.students.map((s,i)=>`<tr><td>${i+1}</td>${['last','first','mi','prog'].map(k=>`<td><input data-s="${s.id}|${k}" value="${esc(s[k])}" ${k=='mi'?'style="width:4rem"':''}></td>`).join('')}<td><button class=dng data-a=delstu title=Remove data-id=${s.id}>${I('trash')}</button></td></tr>`).join('')||'<tr><td colspan=6 class=mut>No students yet. Add one, or paste a list below.</td></tr>'}</table></div>
 <label style="margin-top:1rem">Paste a list, one student per line: LAST NAME, FIRST NAME M.I.<textarea id=bulk rows=4 placeholder="BACALSO, HELEN S."></textarea></label><div class=bar><button data-a=import>Import list</button></div></div>
 <div class="card mut">Data lives on this device and syncs to the file “${FN}” in your Google Drive.</div>`}
function termV(c,t){const T=T_(c,t),k=comp,lab=TERMS.find(x=>x[0]==t)[1],pills=`<div class="bar sub">${[...T.comps.map(x=>[x.id,x.name]),['sum','Summary']].map(([i,l])=>`<button data-c=${i} class="${k==i?'on':''}">${esc(l)}</button>`).join('')}</div>`;
 if(k=='sum')return pills+sumV(c,t);
 const cp=T.comps.find(x=>x.id==k);if(!cp){comp='att';return termV(c,t)}
 if(mode()=='quick')return pills+quickV(c,t,cp);
 const h1=cp.subs.map(s=>`<th colspan=${s.items.length+1}>${esc(s.name)}${cp.subs.length>1?` (${s.w}%)`:''} <button data-a=addcol title="Add column" data-sub=${s.id}>${I('plus')}</button><button data-a=delcol title="Remove last column" data-sub=${s.id}>${I('minus')}</button></th>`).join(''),
 h2=cp.subs.map(s=>s.items.map((x,i)=>`<th><input class=hn data-it="${s.id}|${i}|n" value="${esc(x.n)}"></th>`).join('')+'<th>%</th>').join(''),
 h3=cp.subs.map(s=>s.items.map((x,i)=>`<th><input type=number min=0 data-it="${s.id}|${i}|m" value="${x.m}"></th>`).join('')+`<th data-mx=${s.id}>${mx(s)}</th>`).join('');
 return `${pills}<div class="bar"><b>${lab} — ${esc(cp.name)} (${cp.w}%)</b><span class=sp></span><button data-a=mode>${I('phone')}Phone view</button></div><div class=wrap><table class=grid><tr><th class=nm rowspan=3>Student</th>${h1}<th rowspan=3>Component %</th><th rowspan=3>GE</th><th rowspan=3>× ${cp.w}%</th></tr><tr>${h2}</tr><tr class=max>${h3}</tr>
 ${c.students.map((s,r)=>`<tr data-sid=${s.id}><td class=nm>${r+1}. ${esc(nm(s))}</td>${cp.subs.map(b=>b.items.map((x,i)=>{const v=((T.sc[s.id]||{})[b.id]||[])[i];return `<td><input type=number step=any min=0 data-sc="${s.id}|${b.id}|${i}" value="${v??''}" class="${v>x.m?'over':''}"></td>`}).join('')+'<td class=c></td>').join('')}<td class=c></td><td class=c></td><td class=c></td></tr>`).join('')||'<tr><td class=mut colspan=9>Add students first.</td></tr>'}</table></div>
 <p class=mut>Row 2 names each column; row 3 is the highest possible score. Blank cells count as 0 once a student has any score in that sub-component. Change weights and grade tables under Rules &amp; weights.</p>`}
const T_=(c,t)=>c.terms[t],mode=()=>localStorage.mode||(innerWidth<700?'quick':'grid');let qi=0;
function quickV(c,t,cp){const T=c.terms[t],cols=cp.subs.flatMap(s=>s.items.map((x,i)=>({s,i,x})));qi=Math.max(0,Math.min(qi,cols.length-1));const q=cols[qi];
 return `<div class="bar qb"><button data-a=qprev title=Previous>${I('left')}</button><select data-a=qpick>${cols.map((o,j)=>`<option value=${j} ${j==qi?'selected':''}>${esc(o.s.name)} · ${esc(o.x.n)} (/${o.x.m})</option>`).join('')}</select><button data-a=qnext title=Next>${I('right')}</button></div>
 <div class=bar><b>${esc(q.s.name)} · ${esc(q.x.n)} — highest score ${q.x.m}</b><span class=sp></span><button data-a=mode>${I('grid')}Full grid</button></div>
 <div class=wrap>${c.students.map((s,r)=>{const v=((T.sc[s.id]||{})[q.s.id]||[])[q.i];return `<div class=qr><span>${r+1}. ${esc(nm(s))}</span><input type=number inputmode=decimal step=any min=0 data-sc="${s.id}|${q.s.id}|${q.i}" value="${v??''}" class="${v>q.x.m?'over':''}"></div>`}).join('')||'<p class=mut style="padding:1rem">Add students first.</p>'}</div>
 <button class="pri fab" data-a=qnext title="Next column">${I('right')}</button>`}
function recalc(sid){const c=C(),cp=c.terms[view].comps.find(x=>x.id==comp),tr=$(`tr[data-sid="${sid}"]`);if(!tr||!cp)return;const r=cmp(c,view,sid,cp),td=tr.querySelectorAll('td.c'),n=cp.subs.length;
 cp.subs.forEach((_,j)=>td[j].textContent=f(r.subs[j]&&r.subs[j].p));td[n].textContent=f(r.p);td[n+1].textContent=f(r.g);td[n+2].textContent=f(r.w,2)}
const recalcAll=()=>C().students.forEach(s=>recalc(s.id));
function sumV(c,t){const T=c.terms[t],i=TERMS.findIndex(x=>x[0]==t),tot=sum(T.comps.map(x=>x.w)),pr=i&&T.prev,last=t=='final';
 return `<p class="${tot==100?'ok':'bad'}">${tot==100?'Component weights total 100%.':'Component weights total '+tot+'% — fix this under Rules & weights.'} Term grade = ${T.own}% of this term's score${pr?` + ${T.prev}% of the previous term's grade`:''}.</p>
 <div class=wrap><table><tr><th class=nm>Student</th>${T.comps.map(x=>`<th>${esc(x.name)}<br>GE × ${x.w}%</th>`).join('')}<th>Term score</th><th>Term grade</th>${last?'<th>Remarks</th>':''}</tr>${c.students.map((s,r)=>{const g=grades(c,s.id);return `<tr><td class=nm>${r+1}. ${esc(nm(s))}</td>${T.comps.map(cp=>{const x=cmp(c,t,s.id,cp);return `<td>${f(x.g)} → ${f(x.w,2)}</td>`}).join('')}<td class=c>${f(g[t].x,2)}</td><td class=c>${f(g[t].g,2)}</td>${last?`<td>${g.rem?`<span class="chip ${g.rem=='PASSED'?'ok':'bad'}">${g.rem}</span>`:'—'}</td>`:''}</tr>`}).join('')}</table></div>`}
function gradV(c){const m=c.meta;
 return `<div class=ph><b>${esc(m.school)}</b><br>COLLEGIATE GRADE SHEET<br>${esc(m.sy)}<br>${esc(m.course)} — ${esc(m.title)} · ${esc(m.section)}<br>Instructor: ${esc(m.instructor)}</div>
 <div class="bar noprint"><button class=pri data-a=csv>${I('download')}Export CSV</button><button data-a=print>${I('printer')}Print grade sheet</button><button data-a=backup>${I('download')}Backup</button></div>
 <div class=wrap><table><tr><th class=nm>Student</th><th>Prelim</th><th>Midterm</th><th>Final</th><th>Remarks</th></tr>${c.students.map((s,i)=>{const g=grades(c,s.id);return `<tr><td class=nm>${i+1}. ${esc(nm(s))}</td><td>${f(g.prelim.g,2)}</td><td>${f(g.midterm.g,2)}</td><td><b>${f(g.final.g,2)}</b></td><td>${g.rem?`<span class="chip ${g.rem=='PASSED'?'ok':'bad'}">${g.rem}</span>`:'—'}</td></tr>`}).join('')||'<tr><td colspan=5 class=mut>No students yet.</td></tr>'}</table></div>
 <p class=mut>Passing: ${c.hi?'':'grade of '}${c.pass}${c.hi?' or higher':' or better (lower is better)'}. Term rules are set under Rules &amp; weights.</p>`}
function setV(c){return `<div class=card><h2>Passing rule</h2><div class=bar><label style="width:9rem">Passing grade<input type=number step=.1 data-p=pass value="${c.pass}"></label><label style="width:14rem"><input type=checkbox data-p=hi ${c.hi?'checked':''} style="width:auto"> Higher grade is better</label></div></div>
 <div class=card><h2>Grade conversion tables</h2><p class=mut>One row per line: lowest percentage = grade equivalent. A score gets the grade of the highest row it reaches. Table A and B are the workbook's Prelim/Midterm and Final tables.</p><div class=form>${Object.entries(c.scales).map(([k,S])=>`<label>Table ${k}<textarea rows=12 data-scale=${k}>${S.map(([m,g])=>m+' = '+g).join('\n')}</textarea></label>`).join('')}</div><div class=bar><button data-a=addscale>Add table</button></div></div>
 ${TERMS.map(([t,l])=>termSet(c,t,l)).join('')}<div class=card><button class=dng data-a=reset>Restore e-class defaults</button> <span class=mut>Resets weights, sub-components, tables and scores. Students stay.</span></div>`}
function termSet(c,t,l){const T=c.terms[t],i0=TERMS.findIndex(x=>x[0]==t),I=(p,v,ty='number',w='5rem')=>`<input type=${ty} style="width:${w}" data-tf="${p}" value="${esc(v)}">`;
 return `<div class=card><h2>${l}</h2><div class=form><label>Grade conversion table<select data-tf="${t}|scale">${Object.keys(c.scales).map(k=>`<option ${T.scale==k?'selected':''}>${k}</option>`).join('')}</select></label>
 <label>Weight of this term's own score (%)${I(t+'|own',T.own,'number','100%')}</label>${i0?`<label>Weight of previous term's grade (%)${I(t+'|prev',T.prev,'number','100%')}</label>`:''}</div>
 <div class=wrap style="margin-top:.6rem"><table><tr><th class=nm>Component</th><th>Weight %</th><th>Sub-components (name · weight % inside the component)</th></tr>
 ${T.comps.map((cp,ci)=>`<tr><td class=nm>${I(t+'|'+ci+'|name',cp.name,'text','13rem')}</td><td>${I(t+'|'+ci+'|w',cp.w)}</td><td style="text-align:left;white-space:normal">${cp.subs.map((s,si)=>`<div class=bar style="margin:.15rem 0">${I(t+'|'+ci+'|'+si+'|name',s.name,'text','12rem')}${I(t+'|'+ci+'|'+si+'|w',s.w)}<button class=dng data-a=delsub data-t=${t} data-ci=${ci} data-si=${si} title=Remove>${I('trash')}</button></div>`).join('')}<div class=bar><button data-a=addsub data-t=${t} data-ci=${ci}>Add sub-component</button>${PRE[cp.id]?`<button data-a=preset data-t=${t} data-ci=${ci}>Use suggested: ${PRE[cp.id].map(x=>x[0]).join(', ')}</button>`:''}<span class=chk data-chk="${t}|${ci}"></span></div></td></tr>`).join('')}
 <tr><td class=nm><b>Total</b></td><td><span class=chk data-chk="${t}"></span></td><td></td></tr></table></div>
 <div class=bar><button data-a=copystruct data-t=${t}>Apply these components to all terms</button></div></div>`}
function updChk(){const c=C();document.querySelectorAll('.chk').forEach(e=>{const[t,ci]=e.dataset.chk.split('|'),T=c.terms[t],s=ci==null?sum(T.comps.map(x=>x.w)):sum(T.comps[ci].subs.map(x=>x.w));e.textContent='Total '+s+'%'+(Math.round(s)==100?'':' — should be 100%');e.className='chk '+(Math.round(s)==100?'ok':'bad')})}
/* ---------- events ---------- */
document.addEventListener('input',e=>{const t=e.target,c=C(),d=t.dataset;if(!c)return;
 if(d.m){c.meta[d.m]=t.value;mark(c)}
 else if(d.p){c[d.p]=t.type=='checkbox'?+t.checked:+t.value||0;mark(c)}
 else if(d.s){const[id,k]=d.s.split('|');c.students.find(x=>x.id==id)[k]=t.value;mark(c)}
 else if(d.sc){const[id,sid,i]=d.sc.split('|'),T=c.terms[view];((T.sc[id]??={})[sid]??=[])[i]=t.value===''?null:+t.value;t.classList.toggle('over',+t.value>+subOf(c,view,sid).items[i].m);mark(c);recalc(id)}
 else if(d.it){const[sid,i,fl]=d.it.split('|'),s=subOf(c,view,sid),x=s.items[i];x[fl]=fl=='m'?+t.value:t.value;if(fl=='m'){$(`[data-mx="${sid}"]`).textContent=mx(s);recalcAll()}mark(c)}
 else if(d.tf){const p=d.tf.split('|');let o=c.terms[p[0]];if(p.length>2)o=o.comps[p[1]];if(p.length>3)o=o.subs[p[2]];const k=p[p.length-1];o[k]=k=='name'||k=='scale'?t.value:+t.value||0;mark(c);updChk()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset,c=C();if(d.a=='pick'){cur=t.value;view='students';render()}
 if(d.a=='qpick'){qi=+t.value;render()}
 if(d.scale){const rows=t.value.split('\n').map(l=>l.match(/^\s*(\d+(?:\.\d+)?)\s*[=,:\s]\s*(\d+(?:\.\d+)?)/)).filter(Boolean).map(m=>[+m[1],+m[2]]).sort((a,b)=>a[0]-b[0]);
  if(!rows.length){toast('Use one row per line, like: 75 = 3.0');return render()}c.scales[d.scale]=rows;mark(c);render()}});
document.addEventListener('keydown',e=>{if(e.key!='Enter'||!e.target.dataset.sc)return;const qr=e.target.closest('.qr');if(qr){const n=qr.nextElementSibling&&qr.nextElementSibling.querySelector('input');if(n){n.focus();n.select()}e.preventDefault();return}const td=e.target.closest('td'),i=[...td.parentNode.children].indexOf(td),n=td.parentNode.nextElementSibling,nx=n&&n.children[i]&&n.children[i].querySelector('input');if(nx){nx.focus();nx.select()}e.preventDefault()});
const dropSc=(c,t,sid)=>Object.values(c.terms[t].sc).forEach(o=>delete o[sid]);
const hasSc=(c,t,sid)=>Object.values(c.terms[t].sc).some(o=>(o[sid]||[]).some(v=>v!=null));
const setSubs=(c,t,cp,a)=>{cp.subs.forEach(s=>dropSc(c,t,s.id));cp.subs=a.map(([n,w,k,p,m])=>mkSub(uid(),n,w,k,p,m))};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a],[data-v],[data-c]');if(!b)return;const d=b.dataset,c=C();
 if(d.v){view=d.v;return render()}if(d.c){comp=d.c;return render()}
 const cp=d.t&&c&&c.terms[d.t].comps[d.ci];
 switch(d.a){
 case'mode':localStorage.mode=mode()=='quick'?'grid':'quick';return render();
 case'qprev':qi--;return render();
 case'qnext':qi++;return render();
 case'guest':localStorage.guest=1;return render();
 case'signin':return signin();
 case'signout':U='';tok=null;delete localStorage.user;delete localStorage.tok;delete localStorage.guest;return render();
 case'sync':return sync(1);
 case'addclass':{const n=newClass();D.classes.push(n);cur=n.id;view='students';mark(n);return render()}
 case'delclass':if(confirm('Delete this class and all of its records? This also removes it from Drive on the next sync.')){c.d=1;mark(c);view='students';render()}return;
 case'addstu':{c.students.push({id:uid(),last:'',first:'',mi:'',prog:''});mark(c);render();const r=document.querySelectorAll('[data-s$="|last"]');r[r.length-1].focus();return}
 case'delstu':if(confirm('Remove this student and their scores?')){c.students=c.students.filter(s=>s.id!=d.id);TERMS.forEach(([t])=>delete c.terms[t].sc[d.id]);mark(c);render()}return;
 case'sortstu':c.students.sort((a,b)=>nm(a).localeCompare(nm(b)));mark(c);return render();
 case'import':{const L=$('#bulk').value.split('\n').map(x=>x.trim()).filter(Boolean);L.forEach(l=>{const[last,...r]=l.split(','),p=r.join(',').trim().split(/\s+/);let mi='';if(p.length>1&&/^[A-Za-z]\.?$/.test(p[p.length-1]))mi=p.pop();c.students.push({id:uid(),last:last.trim().toUpperCase(),first:p.join(' ').toUpperCase(),mi,prog:''})});mark(c);toast(L.length+' students added');return render()}
 case'addcol':{const s=subOf(c,view,d.sub),l=s.items[s.items.length-1];s.items.push({n:(l?l.n.replace(/\d+$/,''):'')+(s.items.length+1),m:l?l.m:10});mark(c);return render()}
 case'delcol':{const s=subOf(c,view,d.sub);if(s.items.length>1&&confirm('Remove the last column and its scores?')){s.items.pop();Object.values(c.terms[view].sc).forEach(o=>o[s.id]&&(o[s.id].length=Math.min(o[s.id].length,s.items.length)));mark(c);render()}return}
 case'addsub':cp.subs.push(mkSub(uid(),'New sub-component',0,3,'',10));mark(c);return render();
 case'delsub':{if(cp.subs.length<2)return toast('A component needs at least one sub-component.');const s=cp.subs[d.si];if(!hasSc(c,d.t,s.id)||confirm('This sub-component has scores. Remove it anyway?')){dropSc(c,d.t,s.id);cp.subs.splice(d.si,1);mark(c);render()}return}
 case'preset':if(cp.subs.every(s=>!hasSc(c,d.t,s.id))||confirm('Existing scores in this component will be cleared. Continue?')){setSubs(c,d.t,cp,PRE[cp.id]);mark(c);render()}return;
 case'copystruct':if(confirm('Replace the components in the other terms with these? Scores in those terms will be cleared.')){const S=c.terms[d.t];TERMS.forEach(([t])=>{if(t==d.t)return;const T=c.terms[t];T.comps=JSON.parse(JSON.stringify(S.comps));T.comps.forEach(x=>x.subs.forEach(s=>s.id=uid()));T.sc={}});mark(c);render()}return;
 case'addscale':{const k=String.fromCharCode(65+Object.keys(c.scales).length);c.scales[k]=JSON.parse(JSON.stringify(c.scales.A));mark(c);return render()}
 case'reset':if(confirm('Restore the e-class defaults? This clears all scores in this class.')){Object.assign(c,defaults());mark(c);render()}return;
 case'csv':{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['Student','Prelim','Midterm','Final','Remarks'],...c.students.map(s=>{const g=grades(c,s.id);return[nm(s),f(g.prelim.g,2),f(g.midterm.g,2),f(g.final.g,2),g.rem]})];return dl(rows.map(r=>r.map(q).join(',')).join('\n'),`${c.meta.course}-grades.csv`,'text/csv')}
 case'backup':return dl(JSON.stringify({classes:D.classes}),'eclass-backup.json','application/json');
 case'print':return print()}});
const dl=(t,n,ty)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
/* ---------- Google sign-in + Drive sync ---------- */
const CID=()=>localStorage.cid||window.CLIENT_ID||'',RU=()=>location.origin+location.pathname.replace(/index\.html$/,'');
function goAuth(silent){if(!CID()){const v=prompt('Paste your Google OAuth Client ID (see the setup steps).');if(!v)return;localStorage.cid=v.trim()}
 const s=uid()+uid(),pr=silent?'none':U?'':'select_account';sessionStorage.oas=s;if(silent)sessionStorage.silent=1;
 location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:CID(),redirect_uri:RU(),response_type:'token',scope:SC,state:s,include_granted_scopes:'true',...(pr?{prompt:pr}:{}),...(U?{login_hint:U}:{})})}
const signin=()=>navigator.onLine?goAuth():toast('You need a connection to sign in.');
const tk=()=>{if(tok&&Date.now()<exp)return Promise.resolve(tok);return Promise.reject(Object.assign(Error('auth'),{auth:1}))};
(function(){const h=location.hash.slice(1);if(!/access_token|error=/.test(h))return;const p=new URLSearchParams(h);history.replaceState(null,'',location.pathname+location.search);
 if(p.get('state')!=sessionStorage.oas)return;delete sessionStorage.oas;
 if(p.get('access_token')){tok=p.get('access_token');exp=Date.now()+(+p.get('expires_in')||3600)*1e3-6e4;localStorage.tok=tok;localStorage.exp=exp;delete sessionStorage.silent;auth=1}
 else if(!sessionStorage.silent)toast('Sign-in was cancelled or failed.')})();
const dr=async(u,o={})=>{const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+tok,...o.headers}});if(!r.ok)throw Object.assign(Error('drive'),{status:r.status});return r};
const G='https://www.googleapis.com/',body=()=>JSON.stringify({classes:D.classes});
function merge(rem){let push=false;const a={},b={};D.classes.forEach(x=>a[x.id]=x);rem.classes.forEach(x=>b[x.id]=x);
 D.classes=[...new Set([...Object.keys(a),...Object.keys(b)])].map(id=>{const x=a[id],y=b[id];if(!y||x&&x.u>y.u){push=true;return x}return y});return push}
let busy=0;
async function sync(manual){if(!U||busy)return;if(!navigator.onLine){st('Offline — saved on this device');return render()}
 busy=1;st('Syncing…');try{await tk();let r=null;
  if(!fid){const j=await(await dr(G+'drive/v3/files?fields=files(id)&q='+encodeURIComponent(`name='${FN}' and trashed=false`))).json();fid=j.files[0]?.id||''}
  if(fid)r=await(await dr(G+`drive/v3/files/${fid}?alt=media`)).json();
  const push=r?merge(r):true;
  if(push||D.dirty){if(fid)await dr(G+`upload/drive/v3/files/${fid}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:body()});
   else{const b='b'+uid();const j=await(await dr(G+'upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:FN,mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body()}\r\n--${b}--`})).json();fid=j.id}}
  localStorage.fid=fid;D.dirty=0;save();st('Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  if(!document.activeElement||!document.activeElement.closest('main'))render()
 }catch(e){console.error(e);if(e.auth){busy=0;st('Sign in again to sync');if(manual)goAuth();return}if(e.status==401){tok=null;delete localStorage.tok}if(e.status==404){fid='';delete localStorage.fid}st(manual?'Sync failed — tap Sync now to retry':'Waiting to sync');if(manual)toast('Could not sync. Sign in again if this keeps happening.')}
 busy=0}
addEventListener('online',()=>sync());addEventListener('offline',()=>st('Offline — saved on this device'));
setInterval(()=>{if(D.dirty)sync()},60000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
if(auth)fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}}).then(r=>r.json()).then(p=>{U=localStorage.user=p.email;localStorage.guest='';render();sync(1)}).catch(()=>toast('Sign-in failed. Check the Client ID and redirect address.'));
else if(U&&navigator.onLine){if(tok&&Date.now()<exp)sync();else if(!sessionStorage.silent)goAuth(1);else st('Tap Sync now to sign in again')}
</script></body></html>
