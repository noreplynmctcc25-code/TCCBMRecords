<script>
const I=n=>`<svg class=i><use href="#i-${n}"/></svg>`;
const K='eclass.v2',FN='DBME-eclass-records.json',SC='openid email https://www.googleapis.com/auth/drive.file';
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4),sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const TERMS=[['prelim','Prelim'],['midterm','Midterm'],['final','Final']];
let D=JSON.parse(localStorage[K]||'null')||{classes:[]},cur=localStorage.cur,view='home',comp='',tp=0,pop=null,U=localStorage.user||'',fid=localStorage.fid||'',tok=localStorage.tok,exp=+localStorage.exp||0,auth=0;D.dirty=D.dirty||0;
/* ---------- defaults: taken from the DBME e-class workbook ---------- */
const R=(a,n,f)=>Array.from({length:n},(_,i)=>f(i)+a);
const M1=[0,1,9,17,25,33,41,49,57,66,...R(75,17,i=>i),93,95,97,99],M2=[0,1,4,7,...R(11,16,i=>4*i),...R(75,17,i=>i),93,95,97,99];
const mkS=(m,top)=>m.map((x,i)=>[x,+(top-i/10).toFixed(1)]);
const mkSub=(id,name,w,n,p,m)=>({id,name,w,items:Array.from({length:n},(_,i)=>({n:p+(i+1),m}))});
const S_=(n,w,k,p,m)=>mkSub(uid(),n,w,k,p,m);
const newTerm=(scale,own,prev)=>({scale,own,prev,sc:{},comps:[
 {id:'att',name:'Attendance',w:15,subs:[{...S_('Attendance',100,12,'S',0),att:true}]},
 {id:'cw',name:'Course works',w:35,subs:[S_('Participation',20,5,'P',10),S_('Quiz',20,5,'Q',20),S_('Assignment',20,5,'AS',20),S_('Reporting',20,2,'R',20),S_('Others',20,2,'O',20)]},
 {id:'mp',name:'Major performance',w:25,subs:[S_('Summative',50,2,'S',50),S_('Assessment tasks',50,2,'AT',50)]},
 {id:'me',name:'Major exam',w:25,subs:[S_('Major exam',100,1,'ST',100)]}]});
const defaults=()=>({scales:{A:mkS(M1,4),B:mkS(M2,5)},pass:3,hi:0,terms:{prelim:newTerm('A',100,0),midterm:newTerm('A',50,50),final:newTerm('B',80,20)}});
const newClass=()=>({id:uid(),u:Date.now(),meta:{school:'TALISAY CITY COLLEGE',sy:'First Semester, A.Y. 2026 - 2027',dept:'Department of Business Management & Entrepreneurship',instructor:'MARL VINCENT L. LABITAD, MPA',course:'ABM 1',title:'ORGANIZATION AND MANAGEMENT',sched:'MONDAY (9:00-10:30 AM) & WED (7:30-9:00 AM)',section:'BSHM 1 - DAISY'},students:[],...defaults()});
const PRE={cw:[['Participation',20,5,'P',10],['Quiz',20,5,'Q',20],['Assignment',20,5,'AS',20],['Reporting',20,2,'R',20],['Others',20,2,'O',20]],mp:[['Summative',50,2,'S',50],['Assessment tasks',50,2,'AT',50]]};
/* ---------- computation ---------- */
const AT=c=>c.att||(c.att={p:20,l:10});
const ge=(p,c,t)=>{const S=c.scales[c.terms[t].scale]||c.scales.A;let g=S[0][1];for(const[m,v]of S)if(p>=m)g=v;return g};
const mx=s=>sum(s.items.map(x=>x.m)),subOf=(c,t,id)=>{for(const cp of c.terms[t].comps){const s=cp.subs.find(x=>x.id==id);if(s)return s}};
function sb(c,t,sid,s){const v=(c.terms[t].sc[sid]||{})[s.id]||[],m=mx(s);
 if(s.att){const A=AT(c),d=s.items.filter((_,i)=>c.students.some(u=>((c.terms[t].sc[u.id]||{})[s.id]||[])[i])).length;if(!d||!v.some(x=>x))return null;const to=sum(v.map(x=>x=='P'?A.p:x=='L'?A.l:0));return{to,mx:d*A.p,p:to/(d*A.p)*100}}
 if(!m||!s.items.some((_,i)=>v[i]!=null))return null;const to=sum(s.items.map((_,i)=>v[i]));return{to,mx:m,p:to/m*100}}
function cmp(c,t,sid,cp){const subs=cp.subs.map(s=>sb(c,t,sid,s)),u=cp.subs.map((s,i)=>subs[i]?+s.w:0),ws=sum(u),us=subs.filter(Boolean);if(!us.length)return{subs};
 const p=ws?sum(subs.map((x,i)=>x?x.p*u[i]:0))/ws:sum(us.map(x=>x.p))/us.length,g=ge(p,c,t);return{subs,p,g,w:g*cp.w/100}}
const termG=(c,t,sid)=>{const r=c.terms[t].comps.map(cp=>cmp(c,t,sid,cp));return r.every(x=>x.g!=null)?sum(r.map(x=>x.w)):null};
function grades(c,sid){const o={};let pv=null;TERMS.forEach(([t],i)=>{const T=c.terms[t],x=termG(c,t,sid),pr=i?T.prev:0;let g=null;if(x!=null){if(!pr)g=x*T.own/100;else if(pv!=null)g=x*T.own/100+pv*pr/100}o[t]={x,g};pv=g});
 const g=o.final.g;o.rem=g==null?'':(c.hi?g>=c.pass:g<=c.pass)?'PASSED':'FAILED';return o}
/* ---------- state ---------- */
const C=()=>D.classes.find(c=>c.id==cur&&!c.d),live=()=>D.classes.filter(c=>!c.d),save=()=>localStorage[K]=JSON.stringify(D);
const mark=c=>{if(c)c.u=Date.now();D.dirty=1;save();clearTimeout(mark.t);mark.t=setTimeout(()=>sync(),4000)};
const nm=s=>`${s.last||''}, ${s.first||''} ${s.mi||''}`.trim(),f=(v,d=1)=>v==null?'—':v.toFixed(d);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const st=m=>{const e=$('#st');if(e)e.textContent=m;st.m=m},isT=v=>TERMS.some(t=>t[0]==v);
const mob=()=>matchMedia('(max-width:899px)').matches;
function applyTheme(){const t=localStorage.theme||'system',d=t=='dark'||t=='system'&&matchMedia('(prefers-color-scheme:dark)').matches,h=document.documentElement;h.dataset.dark=d?1:'';h.dataset.sch=localStorage.sch||'blue'}
function keep(){const y=scrollY,w=$('.wrap'),x=w?w.scrollLeft:0;render();scrollTo(0,y);const w2=$('.wrap');if(w2)w2.scrollLeft=x}
function navHtml(c){const M=[['home','Home','home'],['students','Students','users'],...TERMS.map(([t,l],i)=>[t,l,['book','layers','flag'][i]]),['grades','Grades','award'],['set','Rules','sliders']];
 return M.map(([k,l,ic])=>{const tm=isT(k),on=view==k,sb=tm?`<div class=subs>${c.terms[k].comps.map(cp=>(cp.subs.length>1?`<small>${esc(cp.name)}</small>`:'')+cp.subs.map(s=>`<button data-v=${k} data-sb=${s.id} class="${on&&comp==s.id?'on':''}">${esc(s.name)}</button>`).join('')).join('')}<button data-v=${k} data-sb=sum class="${on&&comp=='sum'?'on':''}">${I('award')}Summary</button></div>`:'';

 case'sortstu':c.students.sort((a,b)=>nm(a).localeCompare(nm(b)));mark(c);return render();
 case'import':{const L=$('#bulk').value.split('\n').map(x=>x.trim()).filter(Boolean);L.forEach(l=>{const[last,...r]=l.split(','),p=r.join(',').trim().split(/\s+/);let mi='';if(p.length>1&&/^[A-Za-z]\.?$/.test(p[p.length-1]))mi=p.pop();c.students.push({id:uid(),last:last.trim().toUpperCase(),first:p.join(' ').toUpperCase(),mi,prog:''})});mark(c);toast(L.length+' students added');return render()}
 case'addcol':{const s=subOf(c,view,d.sub),l=s.items[s.items.length-1];s.items.push({n:(l?l.n.replace(/\d+$/,''):'')+(s.items.length+1),m:l?l.m:10});mark(c);return render()}
 case'delcol':{const s=subOf(c,view,d.sub);if(s.items.length>1&&confirm('Remove the last column and its scores?')){s.items.pop();Object.values(c.terms[view].sc).forEach(o=>o[s.id]&&(o[s.id].length=Math.min(o[s.id].length,s.items.length)));mark(c);render()}return}
 case'addsub':cp.subs.push(mkSub(uid(),'New sub-component',0,3,'',10));mark(c);return render();
 case'delsub':{if(cp.subs.length<2)return toast('A component needs at least one sub-component.');const s=cp.subs[d.si];if(!hasSc(c,d.t,s.id)||confirm('This sub-component has scores. Remove it anyway?')){dropSc(c,d.t,s.id);cp.subs.splice(d.si,1);mark(c);render()}return}
 case'preset':if(cp.subs.every(s=>!hasSc(c,d.t,s.id))||confirm('Existing scores in this component will be cleared. Continue?')){setSubs(c,d.t,cp,PRE[cp.id]);mark(c);render()}return;
 case'copystruct':if(confirm('Replace the components in the other terms with these? Scores in those terms will be cleared.')){const S=c.terms[d.t];TERMS.forEach(([t])=>{if(t==d.t)return;const T=c.terms[t];T.comps=JSON.parse(JSON.stringify(S.comps));T.comps.forEach(x=>x.subs.forEach(s=>s.id=uid()));T.sc={}});mark(c);render()}return;
 case'addscale':{const k=String.fromCharCode(65+Object.keys(c.scales).length);c.scales[k]=JSON.parse(JSON.stringify(c.scales.A));mark(c);return render()}
 case'reset':if(confirm('Restore the e-class defaults? This clears all scores in this class.')){Object.assign(c,defaults());mark(c);render()}return;
 case'csv':{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['Student','Prelim','Midterm','Final','Remarks'],...c.students.map(s=>{const g=grades(c,s.id);return[nm(s),f(g.prelim.g,2),f(g.midterm.g,2),f(g.final.g,2),g.rem]})];return dl(rows.map(r=>r.map(q).join(',')).join('\n'),`${c.meta.course}-grades.csv`,'text/csv')}
 case'backup':return dl(JSON.stringify({classes:D.classes}),'eclass-backup.json','application/json');
 case'print':return print()}});
const dl=(t,n,ty)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
/* ---------- Google sign-in + Drive sync ---------- */
const CID=()=>localStorage.cid||window.CLIENT_ID||'',RU=()=>location.origin+location.pathname.replace(/index\.html$/,'');
function goAuth(silent){if(!CID()){const v=prompt('Paste your Google OAuth Client ID (see the setup steps).');if(!v)return;localStorage.cid=v.trim()}
 const s=uid()+uid(),pr=silent?'none':U?'':'select_account';sessionStorage.oas=s;if(silent)sessionStorage.silent=1;
 location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:CID(),redirect_uri:RU(),response_type:'token',scope:SC,state:s,include_granted_scopes:'true',...(pr?{prompt:pr}:{}),...(U?{login_hint:U}:{})})}
const signin=()=>navigator.onLine?goAuth():toast('You need a connection to sign in.');
const tk=()=>{if(tok&&Date.now()<exp)return Promise.resolve(tok);return Promise.reject(Object.assign(Error('auth'),{auth:1}))};
(function(){const h=location.hash.slice(1);if(!/access_token|error=/.test(h))return;const p=new URLSearchParams(h);history.replaceState(null,'',location.pathname+location.search);
 if(p.get('state')!=sessionStorage.oas)return;delete sessionStorage.oas;
 if(p.get('access_token')){tok=p.get('access_token');exp=Date.now()+(+p.get('expires_in')||3600)*1e3-6e4;localStorage.tok=tok;localStorage.exp=exp;delete sessionStorage.silent;auth=1}
 else if(!sessionStorage.silent)toast('Sign-in was cancelled or failed.')})();
const dr=async(u,o={})=>{const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+tok,...o.headers}});if(!r.ok)throw Object.assign(Error('drive'),{status:r.status});return r};
const G='https://www.googleapis.com/',body=()=>JSON.stringify({classes:D.classes});
function merge(rem){let push=false;const a={},b={};D.classes.forEach(x=>a[x.id]=x);rem.classes.forEach(x=>b[x.id]=x);
 D.classes=[...new Set([...Object.keys(a),...Object.keys(b)])].map(id=>{const x=a[id],y=b[id];if(!y||x&&x.u>y.u){push=true;return x}return y});return push}
let busy=0;
async function sync(manual){if(!U||busy)return;if(!navigator.onLine){st('Offline — saved on this device');return render()}
 busy=1;st('Syncing…');try{await tk();let r=null;
  if(!fid){const j=await(await dr(G+'drive/v3/files?fields=files(id)&q='+encodeURIComponent(`name='${FN}' and trashed=false`))).json();fid=j.files[0]?.id||''}
  if(fid)r=await(await dr(G+`drive/v3/files/${fid}?alt=media`)).json();
  const push=r?merge(r):true;
  if(push||D.dirty){if(fid)await dr(G+`upload/drive/v3/files/${fid}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:body()});
   else{const b='b'+uid();const j=await(await dr(G+'upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:FN,mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body()}\r\n--${b}--`})).json();fid=j.id}}
  localStorage.fid=fid;D.dirty=0;save();st('Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  if(!document.activeElement||!document.activeElement.closest('main'))render()
 }catch(e){console.error(e);if(e.auth){busy=0;st('Sign in again to sync');if(manual)goAuth();return}if(e.status==401){tok=null;delete localStorage.tok}if(e.status==404){fid='';delete localStorage.fid}st(manual?'Sync failed — tap Sync now to retry':'Waiting to sync');if(manual)toast('Could not sync. Sign in again if this keeps happening.')}
 busy=0}
addEventListener('online',()=>sync());addEventListener('offline',()=>st('Offline — saved on this device'));
setInterval(()=>{if(D.dirty)sync()},60000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);render();
if(auth)fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}}).then(r=>r.json()).then(p=>{U=localStorage.user=p.email;localStorage.gn=p.given_name||'';localStorage.guest='';render();sync(1)}).catch(()=>toast('Sign-in failed. Check the Client ID and redirect address.'));
else if(U&&navigator.onLine){if(tok&&Date.now()<exp)sync();else if(!sessionStorage.silent)goAuth(1);else st('Tap Sync now to sign in again')}
</script></body></html>
